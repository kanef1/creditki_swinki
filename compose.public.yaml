services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set public database password}
    volumes:
      - public_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U credit -d credit"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set public Django key}
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set public database password}
      POSTGRES_HOST: db
      ALLOWED_HOSTS: ${PUBLIC_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:8081}
      COOKIE_SECURE: "1"
      PUBLIC_DEMO: "1"
      DEMO_VISITOR_ENABLED: "1"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed_public_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"]
    volumes:
      - public_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 5s
      retries: 25
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 5s
      retries: 15
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, --region, us, --protocol, http2, --url, "http://frontend:80", --http-host-header, "localhost:8081"]
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  public_postgres:
  public_uploads:
