name: Verify credit process
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: credit
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U credit" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-production
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      DEMO_PASSWORD: CI-Demo-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py seed_demo
      - run: pytest -c backend/pytest.ini
      - run: python backend/manage.py spectacular --file docs/openapi.yaml --validate
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8080/health/
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()
