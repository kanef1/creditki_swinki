components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: integer
        product:
          type: integer
        company_info:
          allOf:
          - $ref: '#/components/schemas/Company'
          readOnly: true
        product_info:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        term:
          type: integer
          maximum: 2147483647
          minimum: 0
        purpose:
          type: string
          maxLength: 1000
        financial:
          $ref: '#/components/schemas/Financial'
        creation_key:
          type: string
          format: uuid
        status:
          type: string
          readOnly: true
        revision:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
          readOnly: true
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/Verification'
          readOnly: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Scoring'
          readOnly: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          readOnly: true
      required:
      - amount
      - company
      - company_info
      - created_at
      - decisions
      - documents
      - financial
      - history
      - id
      - product
      - product_info
      - purpose
      - revision
      - scores
      - status
      - term
      - updated_at
      - verifications
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        inn:
          type: string
          maxLength: 12
        age_months:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - inn
      - name
    Decision:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        revision:
          type: integer
          maximum: 2147483647
          minimum: 0
        outcome:
          type: string
          maxLength: 32
        reason:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        term:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
      required:
      - actor
      - created_at
      - id
      - outcome
      - reason
      - revision
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    Financial:
      type: object
      properties:
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        profit:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        debt:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
      required:
      - debt
      - profit
      - revenue
    History:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        previous:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 32
        actor:
          type: string
          readOnly: true
        reason:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - reason
      - status
    LoginInput:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - password
      - username
    ManualDecisionInput:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        reason:
          type: string
          maxLength: 1000
          minLength: 10
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
      required:
      - outcome
      - reason
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 1000
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - created_at
      - id
      - message
    OutcomeEnum:
      enum:
      - OFFER_READY
      - REJECTED
      - ADDITIONAL_INFO_REQUIRED
      type: string
      description: |-
        * `OFFER_READY` - OFFER_READY
        * `REJECTED` - REJECTED
        * `ADDITIONAL_INFO_REQUIRED` - ADDITIONAL_INFO_REQUIRED
    PaginatedApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    PaginatedCompanyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PatchedApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: integer
        product:
          type: integer
        company_info:
          allOf:
          - $ref: '#/components/schemas/Company'
          readOnly: true
        product_info:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        term:
          type: integer
          maximum: 2147483647
          minimum: 0
        purpose:
          type: string
          maxLength: 1000
        financial:
          $ref: '#/components/schemas/Financial'
        creation_key:
          type: string
          format: uuid
        status:
          type: string
          readOnly: true
        revision:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
          readOnly: true
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/Verification'
          readOnly: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Scoring'
          readOnly: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          readOnly: true
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        description:
          type: string
        min_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        max_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        min_term:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_term:
          type: integer
          maximum: 2147483647
          minimum: 0
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - description
      - id
      - max_amount
      - min_amount
      - name
      - rate
    Scoring:
      type: object
      properties:
        id:
