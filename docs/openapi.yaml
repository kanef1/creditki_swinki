      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: api_v1_notifications_list
      parameters:
      - name: page
