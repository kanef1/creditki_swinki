  /api/v1/applications/{id}/documents/{document_id}/:
    get:
      operationId: api_v1_applications_documents_retrieve
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{id}/submit/:
